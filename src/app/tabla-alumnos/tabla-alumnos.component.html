<h1>Alumnos</h1>
<table class="table table-dark">
  <thead>
    <tr>
      <th scope="col">Nombre</th>
      <th scope="col">Apellido</th>
    </tr>
  </thead>
  <tbody>
    <tr *ngFor="let alumno of alumnos">
      <td>{{alumno.nombre}}</td>
      <td>{{alumno.apellido}}</td>
    </tr>
  </tbody>
</table>
